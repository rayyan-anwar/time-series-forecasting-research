[project]
name = "time-series-forecasting-research"
version = "0.1.0"
description = "Rolling-origin evaluation of benchmark, exponential-smoothing and lag-regression forecasters with calibrated intervals on seeded synthetic series."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rayyan Anwar" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E741", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
